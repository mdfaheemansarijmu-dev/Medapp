          fi
          chmod 600 debug.keystore
          test -s debug.keystore
          echo "Verifying permanent keystore signature..."
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner"

      - name: Restore Google Services Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p app
            if echo "$GOOGLE_SERVICES_JSON" | grep -q '^{' ; then
              echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Successfully restored app/google-services.json from secret"
          fi

      - name: Make gradlew executable
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          if [ -n "$GITHUB_REF_NAME" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            TAG_VERSION="${TAG_VERSION#V}"
            echo "Building APK for tag $GITHUB_REF_NAME -> Version $TAG_VERSION"
            ./gradlew assembleDebug -PversionName="$TAG_VERSION" --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
