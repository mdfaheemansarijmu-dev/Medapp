name: Build and Attach Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Restore Permanent Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          PERMANENT_KEY_FALLBACK: ""
        run: |
          set -e
          if [ -s debug.keystore ]; then
            echo "debug.keystore found in root directory"
          elif [ -s app/keystore/permanent_debug.base64 ]; then
            echo "Restoring debug.keystore from app/keystore/permanent_debug.base64"
            base64 -d app/keystore/permanent_debug.base64 > debug.keystore
          elif [ -s debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64"
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from secret DEBUG_KEYSTORE_BASE64"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ -n "$PERMANENT_KEY_FALLBACK" ]; then
            echo "Restoring debug.keystore from built-in permanent key"
            printf '%s' "$PERMANENT_KEY_FALLBACK" | base64 --decode > debug.keystore
          else
            echo "ERROR: Permanent keystore not found in repository or secrets!"
            exit 1
          fi
          chmod 600 debug.keystore
          test -s debug.keystore
          echo "Verifying permanent keystore signature..."
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner"

      - name: Restore Google Services Configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p app
            if echo "$GOOGLE_SERVICES_JSON" | grep -q '^{' ; then
              echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
            fi
            echo "Successfully restored app/google-services.json from secret"
          fi

      - name: Restore Environment Configuration
        env:
          RAW_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CLEAN_KEY=$(printf '%s' "$RAW_GEMINI_KEY" | tr -d '"' | tr -d "'" | tr -d '\r' | xargs || true)
          if [ -n "$CLEAN_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$CLEAN_KEY" > .env
          elif [ -f .env ]; then
            echo ".env already present"
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "GEMINI_API_KEY=" > .env
          fi
          echo "Restored .env for release build"

      - name: Make gradlew executable
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          if [ -n "$GITHUB_REF_NAME" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            TAG_VERSION="${TAG_VERSION#V}"
            echo "Building APK for tag $GITHUB_REF_NAME -> Version $TAG_VERSION"
            ./gradlew assembleDebug -PversionName="$TAG_VERSION" --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
